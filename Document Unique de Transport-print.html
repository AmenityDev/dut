<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>DUT (impression)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    html, body { margin: 0; background: #2a2722; font-family: 'Inter', system-ui, sans-serif; }
    .page { width: 820px; margin: 24px auto; break-after: page; }
    .page:last-child { break-after: auto; }
    @media print {
      @page { size: A4; margin: 10mm; }
      html, body { background: #fff; }
      .page { margin: 0 auto; width: 100%; }
      .dut-paper { box-shadow: none !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="store.jsx"></script>
  <script type="text/babel" src="sober.jsx"></script>
  <script type="text/babel" src="dut-ui.jsx"></script>
  <script type="text/babel">
    // Prints the DUT given in ?id=..., otherwise every DUT of the data set.
    const id = new URLSearchParams(location.search).get('id');
    const PrintDeck = () => {
      const s = useDut();
      const bills = id ? s.bills.filter(b => b.id === id) : s.bills;
      return <>{bills.map(b => <div className="page" key={b.id}><DutDocument bill={b}/></div>)}</>;
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<PrintDeck/>);
  </script>
</body>
</html>
